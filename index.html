<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row =>
                    row.some(cell => cell !== '' && cell !== null && cell !== undefined)
                );

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

    <script>
        function calculateTrade() {
            // Get input values
            const buyPrice = parseFloat(document.getElementById('buyPrice').value) || 0;
            const buyQuantity = parseFloat(document.getElementById('buyQuantity').value) || 0;
            const buyFee = parseFloat(document.getElementById('buyFee').value) || 0;
            const sellPrice = parseFloat(document.getElementById('sellPrice').value) || 0;
            const sellFee = parseFloat(document.getElementById('sellFee').value) || 0;

            // Validate inputs
            if (buyPrice <= 0 || buyQuantity <= 0 || sellPrice <= 0) {
                alert('Please enter valid positive values for prices and buy quantity.');
                return;
            }

            // Calculate values
            const boughtAmount = buyPrice * buyQuantity; // Total cost in $
            const buyFeesInTokens = buyQuantity * (buyFee / 100); // Fees in tokens
            const sellQuantity = buyQuantity - buyFeesInTokens; // Selling quantity after fees
            const soldAmount = sellPrice * sellQuantity; // Total received in $
            const sellFees = (soldAmount * sellFee) / 100; // Sell fees in $
            // Break-even price: buyPrice / [(1 - buyFee/100) * (1 - sellFee/100)]
            const breakEvenPrice = buyPrice / ((1 - buyFee / 100) * (1 - sellFee / 100));
            const profit = soldAmount - boughtAmount - sellFees; // Profit in $

            // Update sell quantity input
            document.getElementById('sellQuantity').value = sellQuantity.toFixed(4);

            // Display results
            document.getElementById('boughtAmount').textContent = `$${boughtAmount.toFixed(2)}`;
            document.getElementById('buyFees').textContent = `${buyFeesInTokens.toFixed(4)} tokens`;
            document.getElementById('soldAmount').textContent = `$${soldAmount.toFixed(2)}`;
            document.getElementById('sellFees').textContent = `$${sellFees.toFixed(2)}`;
            document.getElementById('breakEvenPrice').textContent = `$${breakEvenPrice.toFixed(8)}`;
            document.getElementById('profit').textContent = `$${profit.toFixed(2)} (${profit >= 0 ? 'Profit' : 'Loss'})`;
            document.getElementById('profit').style.color = profit >= 0 ? 'green' : 'red';

            // Show output section
            document.getElementById('outputSection').style.display = 'block';
        }

        function resetForm() {
            // Clear input fields
            document.getElementById('buyPrice').value = '';
            document.getElementById('buyQuantity').value = '';
            document.getElementById('buyFee').value = '0.1';
            document.getElementById('sellPrice').value = '';
            document.getElementById('sellQuantity').value = '';
            document.getElementById('sellFee').value = '0.1';

            // Clear output fields
            document.getElementById('boughtAmount').textContent = '';
            document.getElementById('buyFees').textContent = '';
            document.getElementById('soldAmount').textContent = '';
            document.getElementById('sellFees').textContent = '';
            document.getElementById('breakEvenPrice').textContent = '';
            document.getElementById('profit').textContent = '';
            document.getElementById('profit').style.color = '';

            // Hide output section
            document.getElementById('outputSection').style.display = 'none';
        }

        // Add Enter key press event listener
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                calculateTrade();
            }
        });
    </script>
